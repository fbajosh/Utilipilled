name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_type != 'tag'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: |
          ./test.sh
          python3 Support/test_live_harness.py
          python3 Support/test_update_cask.py
      - name: Build release package
        run: ./release.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'fbajosh/Utilipilled'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          LATEST_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          export LATEST_TAG
          python3 - <<'PY'
          import os, plistlib, re
          from pathlib import Path
          version = plistlib.loads(Path('Support/Info.plist').read_bytes())['CFBundleShortVersionString']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use a stable major.minor.patch version.')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('The tag must match the version in Support/Info.plist.')
          latest = os.environ['LATEST_TAG']
          if latest and tuple(map(int, version.split('.'))) <= tuple(map(int, latest.removeprefix('v').split('.'))):
              raise SystemExit('The release version must be newer than the latest published version.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Test
        run: |
          ./test.sh
          python3 Support/test_live_harness.py
          python3 Support/test_update_cask.py
      - name: Build and verify release package
        id: package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./release.sh
          archive="dist/Utilipilled-$VERSION-macOS-arm64.zip"
          (cd dist && shasum -a 256 -c "Utilipilled-$VERSION-macOS-arm64.zip.sha256")
          unpacked=$(mktemp -d "$RUNNER_TEMP/Utilipilled-release.XXXXXX")
          ditto -x -k "$archive" "$unpacked"
          app="$unpacked/Utilipilled.app"
          codesign --verify --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Utilipilled")" = arm64
          cmp Support/Info.plist "$app/Contents/Info.plist"
          cmp Support/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/Utilipilled-$VERSION-macOS-arm64.zip" \
            "dist/Utilipilled-$VERSION-macOS-arm64.zip.sha256" \
            --verify-tag --latest --title "Utilipilled $VERSION" --generate-notes \
            --notes 'Requires Apple silicon and macOS 13 or later. This build is ad-hoc signed and is not notarized; macOS may require one-time approval in System Settings > Privacy & Security.'

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fbajosh/homebrew-tools
          ref: main
          path: homebrew-tools
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Update cask
        run: |
          python3 Support/update_cask.py homebrew-tools/Casks/utilipilled.rb "$VERSION" "$SHA256"
          ruby -c homebrew-tools/Casks/utilipilled.rb
          git -C homebrew-tools config user.name 'github-actions[bot]'
          git -C homebrew-tools config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tools add -- Casks/utilipilled.rb
          if ! git -C homebrew-tools diff --cached --quiet; then
            git -C homebrew-tools commit -m "Update Utilipilled to $VERSION"
            git -C homebrew-tools push origin HEAD:main
          fi
