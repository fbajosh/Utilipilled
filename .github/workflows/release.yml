name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: |
          ./test.sh
          python3 Support/test_live_harness.py
          python3 Support/test_update_cask.py
          python3 Support/test_release_plan.py
      - name: Build release package
        run: ./release.sh

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'fbajosh/Utilipilled'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan release
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          LATEST_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          export LATEST_TAG
          python3 Support/release_plan.py
      - name: Test
        run: |
          ./test.sh
          python3 Support/test_live_harness.py
          python3 Support/test_update_cask.py
          python3 Support/test_release_plan.py
      - name: Build and verify release package
        id: package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./release.sh
          archive="dist/Utilipilled-$VERSION-macOS-arm64.zip"
          (cd dist && shasum -a 256 -c "Utilipilled-$VERSION-macOS-arm64.zip.sha256")
          unpacked=$(mktemp -d "$RUNNER_TEMP/Utilipilled-release.XXXXXX")
          ditto -x -k "$archive" "$unpacked"
          app="$unpacked/Utilipilled.app"
          codesign --verify --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Utilipilled")" = arm64
          cmp Support/Info.plist "$app/Contents/Info.plist"
          cmp Support/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - name: Create version tag
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$commit" ]]; then
              printf 'Refusing to move an existing release tag.\n' >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$commit" --silent
          fi
      - name: Publish release
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/Utilipilled-$VERSION-macOS-arm64.zip" \
            "dist/Utilipilled-$VERSION-macOS-arm64.zip.sha256" \
            --verify-tag --latest --title "Utilipilled $VERSION" --generate-notes \
            --notes 'Requires Apple silicon and macOS 13 or later. This build is ad-hoc signed and is not notarized; macOS may require one-time approval in System Settings > Privacy & Security.'

  homebrew:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fbajosh/homebrew-tools
          ref: main
          path: homebrew-tools
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Update cask
        run: |
          python3 Support/update_cask.py homebrew-tools/Casks/utilipilled.rb "$VERSION" "$SHA256"
          ruby -c homebrew-tools/Casks/utilipilled.rb
          git -C homebrew-tools config user.name 'github-actions[bot]'
          git -C homebrew-tools config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tools add -- Casks/utilipilled.rb
          if ! git -C homebrew-tools diff --cached --quiet; then
            git -C homebrew-tools commit -m "Update Utilipilled to $VERSION"
            git -C homebrew-tools push origin HEAD:main
          fi
